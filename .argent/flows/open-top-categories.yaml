executionPrerequisite: The app is on the Top tab. scripts/bench/measure.sh opens it before each run.
steps:
  - echo: Switch to Top categories and wait for it to load, outside the measured window
  - await: { visible: { id: top-streams-list }, timeout: 60000 }
  - tap: { text: Categories }
  - await: { visible: { id: top-categories-list }, timeout: 60000 }
  - await: { idle: true, stableFor: 3000, timeout: 60000 }
