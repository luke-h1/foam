executionPrerequisite: The app is on foam://dev-tools/chat-perf?suite=1. scripts/bench/measure.sh opens it before each run.
steps:
  - echo: Wait for the suite to auto-start
  - await: { visible: { id: suite-stop }, timeout: 60000 }
  - await: { visible: { id: chat-input-bar }, timeout: 60000 }
  # Perf overlay never idles, so wait a fixed settle instead.
  - wait: 2000
