name: 'Create GitHub Release'
description: 'Render release notes from the changesets, cut CHANGELOG.md for a production build, and create native GitHub releases. Needs Bun on the PATH.'

inputs:
  github_token:
    description: 'The Github token to use'
    required: true
  dry:
    description: 'Whether to run the action in dry mode'
    required: false
    default: 'false'
  variant:
    description: 'The variant to use (production, internal, testflight, or preview)'
    required: true
    default: 'production'
  version:
    description: 'The app version'
    required: true
  tag:
    description: 'The git tag'
    required: true
  deployment_type:
    description: 'The deployment type (native or ota)'
    required: false
    default: 'native'
  commit_changelog:
    description: 'Whether a production build cuts CHANGELOG.md and commits it'
    required: false
    default: 'true'

outputs:
  tag:
    description: 'The resolved git tag'
    value: ${{ steps.release_tag.outputs.tag }}
  release_notes:
    description: 'The rendered release notes'
    value: ${{ steps.release_notes.outputs.release_notes }}
  changelog_updated:
    description: 'Whether CHANGELOG.md was updated'
    value: ${{ steps.release_notes.outputs.changed }}

runs:
  using: 'composite'
  steps:
    - name: Configure git auth
      shell: bash
      run: |
        git config --global --add safe.directory /github/workspace

    - name: Check inputs
      shell: bash
      env:
        INPUTS_DRY: ${{ inputs.dry }}
        INPUTS_VARIANT: ${{ inputs.variant }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_TAG: ${{ inputs.tag }}
        INPUTS_DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
      run: |
        echo "dry=${INPUTS_DRY}"
        echo "variant=${INPUTS_VARIANT}"
        echo "version=${INPUTS_VERSION}"
        echo "tag=${INPUTS_TAG}"
        echo "deployment_type=${INPUTS_DEPLOYMENT_TYPE}"

    - name: Resolve release tag
      id: release_tag
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUTS_TAG: ${{ inputs.tag }}
      run: |
        TAG="${INPUTS_TAG}"
        AUTH_HEADER="$(printf 'luke-h1:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" fetch --tags origin 2>/dev/null || true

        TAG_EXISTS=false
        if git tag -l "$TAG" | grep -qx "$TAG"; then
          TAG_EXISTS=true
          echo "Tag $TAG already exists; will reuse it"
        else
          echo "Tag $TAG does not exist; will create it for native releases"
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "tag_already_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

    - name: Render release notes
      id: release_notes
      shell: bash
      env:
        INPUTS_DRY: ${{ inputs.dry }}
        INPUTS_VARIANT: ${{ inputs.variant }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_TAG: ${{ steps.release_tag.outputs.tag }}
        TAG_ALREADY_EXISTS: ${{ steps.release_tag.outputs.tag_already_exists }}
        INPUTS_DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
        INPUTS_COMMIT_CHANGELOG: ${{ inputs.commit_changelog }}
        INPUTS_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        CUT_RELEASE=false
        if [ "$INPUTS_DRY" = "false" ] && [ "$INPUTS_DEPLOYMENT_TYPE" = "native" ] \
          && [ "$INPUTS_VARIANT" = "production" ] && [ "$INPUTS_COMMIT_CHANGELOG" != "false" ]; then
          CUT_RELEASE=true
        fi

        CHANGED=false
        if [ "$CUT_RELEASE" = true ] && [ "$TAG_ALREADY_EXISTS" = true ]; then
          echo "Tag ${INPUTS_TAG} exists; reusing the notes recorded in CHANGELOG.md at that tag"
          git show "refs/tags/${INPUTS_TAG}:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          RELEASE_NOTES="$(bun scripts/release-notes.ts show --version "$INPUTS_VERSION" --changelog "$RUNNER_TEMP/CHANGELOG.md")"
        elif [ "$CUT_RELEASE" = true ]; then
          RELEASE_NOTES="$(bun scripts/release-notes.ts release --version "$INPUTS_VERSION")"
          bunx oxfmt CHANGELOG.md
          git add -- CHANGELOG.md .changeset
          if git diff --cached --quiet -- CHANGELOG.md .changeset; then
            echo "CHANGELOG.md already carries ${INPUTS_VERSION}"
          else
            CHANGED=true
            git config user.name "luke-h1"
            git config user.email "55030296+luke-h1@users.noreply.github.com"
            git commit -m "chore(changelog): release ${INPUTS_VERSION}" -- CHANGELOG.md .changeset
            AUTH_HEADER="$(printf 'luke-h1:%s' "$INPUTS_GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::main moved since this build and the changelog commit does not rebase onto it cleanly; rerun the release"
              exit 1
            fi
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
        else
          RELEASE_NOTES="$(bun scripts/release-notes.ts pending)"
        fi

        echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "release_notes<<${delim}"
          echo "$RELEASE_NOTES"
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"

        echo "$RELEASE_NOTES" > .release-notes-body.md

    - name: Resolve release labels
      id: labels
      shell: bash
      env:
        INPUTS_VARIANT: ${{ inputs.variant }}
        INPUTS_DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
      run: |
        VARIANT_LABEL="$(bunx tsx scripts/workflows/variant-cli.ts label --variant "$INPUTS_VARIANT")"

        DEPLOYMENT_LABEL="Native Build"
        if [ "$INPUTS_DEPLOYMENT_TYPE" = "ota" ]; then
          DEPLOYMENT_LABEL="OTA Update"
        fi

        echo "variant=$VARIANT_LABEL" >> "$GITHUB_OUTPUT"
        echo "deployment=$DEPLOYMENT_LABEL" >> "$GITHUB_OUTPUT"

    - name: Create native tag
      if: ${{ inputs.dry == 'false' && inputs.deployment_type == 'native' && steps.release_tag.outputs.tag_already_exists != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUTS_TAG: ${{ steps.release_tag.outputs.tag }}
      run: |
        set -euo pipefail

        # github-tag-action runs in a container. The macOS runner cannot start
        # one. Create the same lightweight tag through the Git refs API.
        SHA="$(git rev-parse HEAD)"

        gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
          -f ref="refs/tags/${INPUTS_TAG}" \
          -f sha="$SHA" \
          --silent

    - name: Build release body
      id: release_body
      if: ${{ inputs.dry == 'false' && inputs.deployment_type == 'native' }}
      shell: bash
      env:
        VARIANT_LABEL: ${{ steps.labels.outputs.variant }}
        DEPLOYMENT_LABEL: ${{ steps.labels.outputs.deployment }}
        INPUTS_TAG: ${{ steps.release_tag.outputs.tag }}
        INPUTS_VERSION: ${{ inputs.version }}
      run: |
        BODY="## ${VARIANT_LABEL} ${DEPLOYMENT_LABEL}: ${INPUTS_TAG}

        **Deployment Type:** ${DEPLOYMENT_LABEL}
        **App Version:** \`${INPUTS_VERSION}\`

        ---

        $(cat .release-notes-body.md)"

        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "body<<${delim}"
          echo "$BODY"
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"

    - name: Create or update native release
      if: ${{ inputs.dry == 'false' && inputs.deployment_type == 'native' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUTS_TAG: ${{ steps.release_tag.outputs.tag }}
        INPUTS_VARIANT: ${{ inputs.variant }}
        RELEASE_BODY: ${{ steps.release_body.outputs.body }}
      run: |
        printf '%s' "$RELEASE_BODY" > .release-body.md

        latest_args=(--latest=false)
        if [ "$INPUTS_VARIANT" = "production" ]; then
          latest_args=(--latest)
        fi

        if gh release view "$INPUTS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit "$INPUTS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$INPUTS_TAG" \
            --notes-file .release-body.md \
            "${latest_args[@]}"
        else
          gh release create "$INPUTS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$INPUTS_TAG" \
            --notes-file .release-body.md \
            "${latest_args[@]}"
        fi

    - name: Dry run output
      if: ${{ inputs.dry == 'true' }}
      shell: bash
      env:
        INPUTS_TAG: ${{ steps.release_tag.outputs.tag }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_VARIANT: ${{ inputs.variant }}
        INPUTS_DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
        DEPLOYMENT_LABEL: ${{ steps.labels.outputs.deployment }}
        RELEASE_NOTES: ${{ steps.release_notes.outputs.release_notes }}
      run: |
        echo "========= DRY MODE =========="
        echo "Tag: ${INPUTS_TAG}"
        echo "App Version: ${INPUTS_VERSION}"
        echo "Variant: ${INPUTS_VARIANT}"
        echo "Deployment Type: ${DEPLOYMENT_LABEL}"

        if [ "$INPUTS_DEPLOYMENT_TYPE" = "native" ]; then
          echo "Would create/update the native GitHub release; a production build would also cut CHANGELOG.md"
        else
          echo "Would render OTA release notes; no GitHub release, git tag, or CHANGELOG.md commit"
        fi

        echo ""
        echo "=== Pending release notes ==="
        echo "$RELEASE_NOTES"
        echo "============================="
