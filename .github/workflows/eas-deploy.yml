name: EAS app deployment
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'App variant to build/deploy'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - testflight
          - internal
      platform:
        description: 'The platform to deploy to'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - ios
          - android
jobs:
  app_deploy:
    name: EAS build & submit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: eas-deploy-fingerprint-main
    permissions:
      contents: read
    steps:
      - name: 🔎 Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/tutorial/eas/using-github/"
            exit 1
          fi

      - name: 🏗 Setup repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun-install
        with:
          node: 'true'
          ignore-scripts: 'true'

      - name: Λ Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun
          patch-watchers: false

      - name: 🚀 Build & deploy
        env:
          VARIANT: ${{ inputs.variant }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          eas build --profile "$VARIANT" --platform "$PLATFORM" --non-interactive --no-wait --auto-submit
