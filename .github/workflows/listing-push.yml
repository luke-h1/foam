name: Listing push
# Appeeky Spec: push the store listing to App Store Connect when a change lands on main,
# then commit the release record in appeeky/releases/.
on:
  push:
    branches: [main]
    paths:
      - 'appeeky/store/**'
      - 'appeeky.spec.yaml'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stores
    permissions:
      contents: write
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: 🔐 Load secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: 2.34.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPEEKY_API_KEY: op://ci-cd/foam-mobile-production/APPEEKY_API_KEY

      - name: 🚀 Push the listing
        run: npx --yes @appeeky/spec push --yes --note "$HEAD_COMMIT_MESSAGE"
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: 📝 Commit the release record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appeeky
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): record listing release"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GH_TOKEN: ${{ secrets.LUKE_H1_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
