name: Detect fingerprint changes
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.cursor/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Detect fingerprint changes
    # Fork PRs stay on GitHub-hosted runners: foam is public, and a self-hosted
    # runner would run the fork's code on the foam machine.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'foam' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🥟 Setup Bun and install dependencies
        uses: $/.github/actions/setup-bun-install

      - name: 🌲 Create worktree for the base commit
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git worktree remove --force .__pr_base__ 2>/dev/null || true
          git worktree prune
          git worktree add --detach .__pr_base__ "$BASE_SHA"

      - name: ⚙️ Install dependencies for base commit
        run: |
          set -euo pipefail

          pushd .__pr_base__ >/dev/null
          bun install --frozen-lockfile
          popd >/dev/null

      - name: 🧬 Compare fingerprints
        run: |
          set -euo pipefail

          FP_DIR="$RUNNER_TEMP/fingerprints"
          mkdir -p "$FP_DIR"

          compute_tree() {
            local DIR="$1" PREFIX="$2"
            pushd "$DIR" >/dev/null
            for VARIANT in production testflight internal; do
              for PLATFORM in ios android; do
                EXPO_PUBLIC_APP_VARIANT="$VARIANT" bunx expo-updates fingerprint:generate --platform "$PLATFORM" \
                  | jq -r '.hash' > "$FP_DIR/${PREFIX}_${PLATFORM}_${VARIANT}" &
              done
              wait
            done
            popd >/dev/null
          }

          compute_tree . head &
          compute_tree .__pr_base__ base &
          wait

          CHANGED=()
          ROWS=""

          for VARIANT in production testflight internal; do
            VARIANT_CHANGED="false"

            for PLATFORM in ios android; do
              BASE="$(cat "$FP_DIR/base_${PLATFORM}_${VARIANT}" 2>/dev/null || true)"
              HEAD="$(cat "$FP_DIR/head_${PLATFORM}_${VARIANT}" 2>/dev/null || true)"

              for HASH in "$BASE" "$HEAD"; do
                if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
                  echo "::error::Missing fingerprint for ${PLATFORM} ${VARIANT}"
                  exit 1
                fi
              done

              if [ "$BASE" != "$HEAD" ]; then
                VARIANT_CHANGED="true"
              fi

              ROWS+="| ${VARIANT} | ${PLATFORM} | \`${BASE}\` | \`${HEAD}\` |"$'\n'
            done

            if [ "$VARIANT_CHANGED" = "true" ]; then
              CHANGED+=("$VARIANT")
            fi
          done

          {
            if [ "${#CHANGED[@]}" -eq 0 ]; then
              echo "### ✅ OTA compatible"
              echo ""
              echo "This PR does not change the native fingerprint. It can ship as an OTA update."
            else
              printf -v VARIANTS '%s, ' "${CHANGED[@]}"
              echo "### 🔨 Native build required"
              echo ""
              echo "This PR changes the native fingerprint for ${VARIANTS%, }. It cannot ship as an OTA update."
              echo ""
              echo "The deploy workflow picks a native build for it. If the current \`VERSION\` in \`app.config.ts\` already has a release tag, the workflow bumps the patch version and commits it to \`main\`."
            fi
            echo ""
            echo "<details>"
            echo "<summary>Fingerprints against the base commit</summary>"
            echo ""
            echo "| Variant | Platform | Base | Head |"
            echo "|---|---|---|---|"
            printf '%s' "$ROWS"
            echo ""
            echo "</details>"
          } > "$RUNNER_TEMP/ota-compat.md"

          cat "$RUNNER_TEMP/ota-compat.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: fingerprint-diff
          GITHUB_TOKEN: ${{ secrets.PR_COMMENT_GITHUB_TOKEN || github.token }}
          path: ${{ runner.temp }}/ota-compat.md

      - name: 🧹 Clean up worktree
        if: always()
        run: git worktree remove --force .__pr_base__ || true
