name: React Doctor

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # react-doctor v2.2.9 runs a best-effort `git fetch --depth=1 origin
      # <base-sha>` before its baseline diff. On a full checkout (fetch-depth: 0
      # above) that fetch writes .git/shallow. This breaks the merge-base that
      # its three-dot diff needs, so the scan leaves baseline mode and reports
      # old issues as new. The base commit is already here, so point origin at
      # an unreachable URL: the fetch fails, the action ignores the failure,
      # and the repo stays complete. The rest of the action uses the GitHub
      # API, not git. Remove once the action drops or guards the depth-1 fetch.
      - name: Keep react-doctor's base fetch from shallowing the repo
        run: git remote set-url origin https://invalid.invalid/unreachable.git

      # The step above makes react-doctor's base fetch always fail. The action
      # then cannot tell "base already present" from "fetch failed", so it
      # posts a false "shallow checkout, no merge base" warning on every PR.
      # The diff is still correct, from the fetch-depth: 0 history on disk:
      # #877 showed one base-scoped finding, not every old issue. Silence the
      # warning, and revisit it with the origin workaround above.
      - name: Run React Doctor
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          blocking: error
          commit-status: false
          silence-missing-baseline-warning: true
