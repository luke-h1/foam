name: React Doctor

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # react-doctor v2.2.8 runs a best-effort `git fetch --depth=1 origin
      # <base-sha>` before its baseline diff. On a fully-fetched checkout
      # (fetch-depth: 0 above) that fetch writes .git/shallow, which breaks the
      # merge-base its own three-dot diff needs, so the scan silently falls out
      # of baseline mode and reports pre-existing issues as PR-introduced. The
      # base commit is already present here, making that fetch redundant -
      # point origin at an unreachable URL so it fails cleanly (the action
      # ignores the failure) instead of shallowing the repo. Everything else in
      # the action talks to GitHub over the API, not git. Remove once the
      # action drops or guards the depth-1 fetch.
      - name: Keep react-doctor's base fetch from shallowing the repo
        run: git remote set-url origin https://invalid.invalid/unreachable.git

      - name: Run React Doctor
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          blocking: error
          commit-status: false
