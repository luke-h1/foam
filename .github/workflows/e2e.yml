name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fingerprint:
    name: 🔍 Check Fingerprint
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      hash: ${{ steps.fingerprint.outputs.hash }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun-install
        with:
          ignore-scripts: 'true'

      - name: 🔍 Calculate fingerprint
        id: fingerprint
        run: |
          set -euo pipefail

          HASH=$(npx expo-updates fingerprint:generate --platform ios | jq -r '.hash')
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::expo-updates fingerprint:generate produced no hash"
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "📱 iOS Fingerprint: $HASH"

      - name: 📂 Check build cache
        id: cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e-build.tar.gz
          key: e2e-ios-${{ steps.fingerprint.outputs.hash }}
          lookup-only: true

  build:
    name: 🔨 Build E2E App
    needs: fingerprint
    if: needs.fingerprint.outputs.cache-hit != 'true' || inputs.force_rebuild
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun-install
        with:
          ignore-scripts: 'true'

      - name: 🔐 Load secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: 2.34.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GOOGLE_SERVICES_IOS_PROD_BS4: op://ci-cd/foam-mobile-staging/GOOGLE_SERVICES_IOS_PROD_BS4

      - name: 📄 Decode Google Services file
        run: |
          echo "$GOOGLE_SERVICES_IOS_PROD_BS4" | base64 -d > GoogleService-Info-prod.plist

      - name: Λ Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      - name: 📱 Build E2E app
        run: |
          eas build --profile e2e --platform ios --local --non-interactive --output=e2e-build.tar.gz
        env:
          EXPO_PUBLIC_APP_VARIANT: e2e
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 💾 Save build to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e-build.tar.gz
          key: e2e-ios-${{ needs.fingerprint.outputs.hash }}

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-build
          path: e2e-build.tar.gz
          retention-days: 30

  test:
    name: 🧪 Run E2E Tests
    needs: [fingerprint, build]
    if: always() && needs.fingerprint.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun-install
        with:
          ignore-scripts: 'true'

      - name: 📂 Restore build from cache
        if: needs.build.result == 'skipped'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e-build.tar.gz
          key: e2e-ios-${{ needs.fingerprint.outputs.hash }}
          fail-on-cache-miss: true

      - name: 📥 Download build artifact
        if: needs.build.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-build

      - name: 📦 Extract app
        run: |
          set -euo pipefail

          tar -xzf e2e-build.tar.gz
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in e2e-build.tar.gz"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found app at: $APP_PATH"

      - name: Λ Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      - name: 📦 Push OTA update (JS changes only)
        if: needs.build.result == 'skipped'
        run: |
          echo "🚀 Pushing OTA update for JS changes..."
          eas update --channel e2e --message "E2E: ${E2E_UPDATE_MESSAGE}" --non-interactive
        env:
          EXPO_PUBLIC_APP_VARIANT: e2e
          E2E_UPDATE_MESSAGE: ${{ github.event.pull_request.title || github.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Install Maestro
        env:
          MAESTRO_VERSION: '2.6.1'
          EXPECTED_SHA256: '3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            -o "$tmp/maestro.zip"
          echo "${EXPECTED_SHA256}  $tmp/maestro.zip" | shasum -a 256 -c -
          rm -rf "$HOME/.maestro"
          mkdir -p "$HOME/.maestro"
          unzip -qo "$tmp/maestro.zip" -d "$tmp"
          cp -rf "$tmp"/maestro/* "$HOME/.maestro"
          rm -rf "$tmp"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 📱 Boot Simulator
        run: |
          set -euo pipefail

          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available 'iPhone 16' simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: 📲 Install app on simulator
        run: |
          xcrun simctl install booted "$APP_PATH"

      - name: 🚀 Start mock server
        run: |
          set -euo pipefail

          bun run e2e:mock-server &
          echo "MOCK_SERVER_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3001/"; then
              echo "Mock server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mock server did not respond on port 3001 within 30s"
          exit 1

      - name: 🧪 Run Maestro tests
        run: |
          bun run e2e:test
        env:
          APP_ID: foam-tv-e2e
          DEV_CLIENT: 'false'

      - name: 🛑 Stop mock server
        if: always()
        run: |
          if [ -n "${MOCK_SERVER_PID:-}" ]; then
            kill "$MOCK_SERVER_PID" 2>/dev/null || true
          fi
          pkill -f 'e2e/mock-server/server.ts' 2>/dev/null || true

      - name: 📤 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maestro-results-${{ github.run_id }}
          path: ~/.maestro/tests/
          retention-days: 7
