name: Chat performance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'modules/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'babel.config.js'
      - 'jest.config.js'
      - 'reassure*'
      - 'scripts/workflows/chat-performance-comment.ts'
      - '.github/workflows/chat-performance.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chat-performance:
    name: Chat performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun and install PR dependencies
        uses: ./.github/actions/setup-bun-install
        with:
          node: 'true'

      - name: Create base worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git worktree remove --force .__perf_base__ 2>/dev/null || true
          git worktree add --detach .__perf_base__ "$BASE_SHA"

      - name: Install base dependencies
        run: |
          set -euo pipefail

          pushd .__perf_base__ >/dev/null
          bun install --frozen-lockfile
          popd >/dev/null

      - name: Measure base chat performance
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          pushd .__perf_base__ >/dev/null
          bun run test:perf -- --baseline --branch "$BASE_REF" --commit-hash "$BASE_SHA" -- --testTimeout=30000
          popd >/dev/null

          mkdir -p .reassure
          cp .__perf_base__/.reassure/baseline.perf .reassure/baseline.perf
          git worktree remove --force .__perf_base__

      - name: Measure PR chat performance
        id: perf
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          bun run test:perf -- --branch "$HEAD_REF" --commit-hash "$HEAD_SHA" -- --testTimeout=30000

      - name: Build PR comment
        if: always()
        env:
          PERF_STATUS: ${{ steps.perf.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          bunx tsx scripts/workflows/chat-performance-comment.ts \
            --status "$PERF_STATUS" \
            --run-url "$RUN_URL" \
            --output .reassure/pr-comment.md

      - name: Comment chat performance results
        if: always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: chat-performance
          path: .reassure/pr-comment.md
          GITHUB_TOKEN: ${{ secrets.PR_COMMENT_GITHUB_TOKEN || github.token }}

      - name: Fail on chat performance errors
        if: steps.perf.outcome == 'failure'
        run: exit 1
