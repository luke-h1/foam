changes:
  - locale: en-GB
    field: whatsNew
    before: |-
      7TV paints now stay on while chat scrolls, so names keep their colour instead of flashing back to plain text.

      - Fixed a stream that could freeze mid-watch with no way back
      - Fixed replies that showed the @name twice
      - Tidied the spacing between badges and names in chat

      Thanks to everyone who reported the freeze.
    after: |-
      Chat stays smooth on the busiest channels now, through emote floods, raids and fast scrolling.

      - Busy chat uses less battery, so long watch sessions last longer
      - Painted names and animated 7TV paints no longer slow chat down
      - iPhone Duo: lists, the categories grid and the chat composer now fit the open display
      - iPhone Duo: the screen no longer sticks in portrait after a search
