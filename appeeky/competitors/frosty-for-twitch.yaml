      The better mobile Twitch chat experience.

      Frosty brings quality-of-life features and, most importantly, third-party emotes from 7TV, BetterTTV (BTTV), and FrankerFaceZ (FFZ) — popular extensions for Twitch used by millions.

      Features:
      • Support for 7TV, BetterTTV (BTTV), and FrankerFaceZ (FFZ) emotes and badges
      • Browse followed streams, top streams, and top categories
      • Autocomplete for emotes and user mentions
      • Light, dark, and black (OLED) themes
      • Search for channels and categories
      • See and filter chatters in a channel
      • Local chat user message history
