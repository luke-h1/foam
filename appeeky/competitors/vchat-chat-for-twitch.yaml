    description: |-
      Twitch chat that keeps up, on your iPhone.

      7TV, BTTV and FFZ emotes render inline, animated, in every channel — the same
      chat your friends see on desktop, not a stripped-down version of it. Open the
      app and you are in, anonymously, with no account and no sign-in wall.

      WATCH
      Live streams, past broadcasts, highlights and clips, in one player. Past
      broadcasts replay the chat that ran alongside them, in step with the video, with
      the same emotes and colours as live chat. Picture in Picture and background
      audio keep a stream going while you do something else.

